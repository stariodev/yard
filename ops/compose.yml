# Yard's own project. The apply container is not a service here.
services:
  app:
    image: ${IMAGE}
    pull_policy: never
    build:
      context: ${CHECKOUT}
      dockerfile: ops/Containerfile
    restart: always
    networks:
      yard:
        aliases:
          - yard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${YARD_ROOT}:${YARD_ROOT}
      # The directory, not the socket file, so a host podman.socket restart does not leave Yard on a stale socket.
      - ${YARD_PODMAN_DIR}:/run/podman
      - ${DATA_DIR}:/data
      # Container logs live in the journal; Yard reads them for the API.
      - /var/log/journal:/var/log/journal:ro
      # Yard's own events go to journald through the native socket.
      - /run/systemd/journal/socket:/run/systemd/journal/socket
    # The yard app's env file. install.sh runs this before Yard has written it.
    env_file:
      - path: ${APP_ENV}
        required: false
    environment:
      SHA: ${SHA}
      IMAGE: ${IMAGE}
      YARD_ROOT: ${YARD_ROOT}
      YARD_PODMAN_SOCK: ${YARD_PODMAN_SOCK}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    # The deploy gate: `up --wait` waits for healthy, and a Yard that never answers reverts to the last image.
    # Podman runs the first check at start and drops start_interval. Thus the first check waits itself:
    # curl tries once a second until Yard answers, for 60 s at most. A deploy waits as long as Yard boots.
    # One failed check marks Yard unhealthy, so a Yard that never answers fails the deploy after 60 s.
    # The checks after the deploy only feed the status, so one an hour is enough.
    # Podman splits each argument at spaces, so no argument has a space.
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - --retry
        - "60"
        - --retry-delay
        - "1"
        - --retry-max-time
        - "60"
        - --retry-connrefused
        - --retry-all-errors
        - --connect-timeout
        - "2"
        - --max-time
        - "5"
        - http://127.0.0.1:8000/health
      interval: 1h
      timeout: 75s
      retries: 1

  caddy:
    image: docker.io/library/caddy:2
    restart: always
    networks:
      - yard
    ports:
      # Caddy listens on 443 in the container so Alt-Svc advertises h3 on :443.
      # The host redirects public 443 — TCP and UDP — to 8443.
      - "8443:443/tcp"
      - "8443:443/udp"
    volumes:
      - ${YARD_ROOT}/apps/yard/caddy/config:/config
      - ${YARD_ROOT}/apps/yard/caddy/data:/data
      - ${YARD_ROOT}/apps/yard/caddy/run:/run/caddy
      - ${CHECKOUT}/ops/Caddyfile:/etc/caddy/Caddyfile:ro
    # --resume starts from the last loaded config, so a restart never drops a site.
    # A fresh host has no autosave and starts from the Caddyfile. Yard loads the Caddyfile at boot.
    # The admin socket. A resumed 0.10 autosave has no admin block, so the env wins there.
    environment:
      CADDY_ADMIN: unix//run/caddy/admin.sock
    entrypoint: ["caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--resume"]

networks:
  yard:
    external: true
    name: yard
